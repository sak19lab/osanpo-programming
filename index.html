<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;">
<title>おさんぽプログラミング</title>
<style>
:root{
  --bg:#fff8ec; --ink:#4a3b2a; --card:#ffffff; --ground:#fbe7c6; --grass:#bfe3a5; --line:#ead3ab;
  --R:#ff8a3d; --L:#3d8bff; --U:#2bb673; --D:#a05cf0; --rep:#f2b200; --bad:#ff4d4d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.screen{display:none;min-height:100%;padding:12px 16px 20px;flex-direction:column;align-items:center;gap:14px}
.screen.on{display:flex}

/* ---------- home ---------- */
h1{margin:8px 0 0;font-size:clamp(26px,5vw,40px);letter-spacing:.05em;text-align:center}
h1 small{display:block;font-size:.45em;opacity:.6;letter-spacing:.1em}
.charas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.charas button{width:68px;height:68px;font-size:40px;border-radius:20px;background:var(--card);
  box-shadow:0 4px 0 var(--line)}
.charas button.sel{outline:5px solid var(--R);transform:translateY(-3px)}
.worlds{display:grid;gap:14px;width:min(720px,100%)}
.world{background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:0 5px 0 var(--line);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.world .wname{font-size:22px;font-weight:700;min-width:180px;display:flex;align-items:center;gap:8px}
.world .wname .ico{font-size:32px}
.world .stages{display:flex;gap:10px;margin-left:auto}
.world .stages button{width:64px;height:64px;border-radius:50%;font-size:26px;font-weight:700;
  background:var(--ground);box-shadow:0 4px 0 var(--line);position:relative}
.world .stages button.done{background:#ffe27a}
.world .stages button.done::after{content:"⭐";position:absolute;right:-6px;top:-8px;font-size:22px}

/* ---------- game ---------- */
.top{width:100%;max-width:960px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.round{width:58px;height:58px;border-radius:50%;background:var(--card);font-size:28px;box-shadow:0 4px 0 var(--line)}
.label{font-size:28px;font-weight:700;background:var(--card);padding:6px 22px;border-radius:30px;box-shadow:0 4px 0 var(--line)}
.board{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 var(--line);background:var(--grass)}
.cell{position:absolute;width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cell)*.58)}
.cell.path{background:var(--ground);border:2px solid #f5dcb2}
.cell.wall{background:var(--grass)}
.cell.start{background:#ffeccc}
.topr{display:flex;gap:10px}
#hintBtn{background:#fff6c2}
.chara.ghost{opacity:.5;transition:transform .8s ease-in-out;z-index:3}
.foot{position:absolute;width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;
  z-index:1;pointer-events:none;transition:opacity .8s}
.foot svg{width:42%;height:42%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.foot.out{opacity:0}
body.running #hintBtn{pointer-events:none;opacity:.55}
.cell.got{animation:pop .4s forwards}
@keyframes pop{50%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}
.chara{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cell)*.7);transition:transform .45s ease-in-out;z-index:2;pointer-events:none}
.chara span{display:inline-block;transition:transform .2s}
.chara.shake span{animation:shake .5s}
@keyframes shake{20%,60%{translate:-8px 0}40%,80%{translate:8px 0}}
.chara.hop span{animation:hop .5s 3}
@keyframes hop{50%{translate:0 -30%}}
.bubble{position:absolute;top:-6%;right:-10%;font-size:calc(var(--cell)*.32);background:#fff;border-radius:14px;
  padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap}

.prog{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:960px;padding:10px 12px;
  background:#fff3dc;border-radius:22px;min-height:92px;align-items:center}
.prog.full{animation:shake .4s}
.slot{width:70px;height:70px;border-radius:16px;border:3px dashed #e3c58f;display:flex;align-items:center;justify-content:center;position:relative}
.slot .num{position:absolute;bottom:-2px;left:4px;font-size:12px;opacity:.4}
.card{width:70px;height:70px;border-radius:16px;color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.18);position:relative;transition:transform .15s}
.card svg{width:62%;height:62%}
.card .rep{position:absolute;right:-8px;top:-10px;background:var(--rep);color:#fff;font-weight:800;font-size:18px;
  border-radius:14px;padding:1px 7px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.card.now{transform:scale(1.18);outline:5px solid #ffd400;z-index:1}
.card.sel{outline:5px solid #ffd400;transform:translateY(-8px);animation:bob 1s ease-in-out infinite}
.card.bad{outline-color:var(--bad)}
.card .no{position:absolute;left:6px;bottom:3px;font-size:13px;font-weight:800;opacity:.9}
.card.pop{animation:popin .35s ease-out}
@keyframes popin{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.card.extra{filter:grayscale(.9);opacity:.55;outline:4px dashed #9a8a76}
.prog.full{box-shadow:inset 0 0 0 5px var(--bad)}
.round.pulse{animation:hop .6s infinite;outline:4px solid var(--bad)}
.side{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
@keyframes bob{50%{translate:0 -5px}}
.palette{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.palette .card{width:86px;height:86px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.palette .card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.palette .repbtn{width:86px;height:86px;border-radius:22px;background:var(--rep);color:#fff;font-size:30px;font-weight:800;
  box-shadow:0 6px 0 rgba(0,0,0,.2)}
.palette .sep{width:6px}
.controls{display:flex;gap:14px;align-items:center}
.go{height:80px;padding:0 38px;border-radius:40px;background:#ff5a7a;color:#fff;font-size:34px;font-weight:800;
  box-shadow:0 6px 0 #c63a57;display:flex;align-items:center;gap:8px}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #c63a57}
body.running .palette,body.running .controls .round,body.running .prog{pointer-events:none;opacity:.55}
body.running .go{pointer-events:none;opacity:.6}

/* ---------- clear overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(255,248,236,.85);display:none;align-items:center;justify-content:center;z-index:10}
.overlay.on{display:flex}
.panel{background:#fff;border-radius:30px;padding:26px 34px;text-align:center;box-shadow:0 8px 0 var(--line);max-width:90vw}
.panel .big{font-size:84px;animation:hop .6s 2}
.panel .msg{font-size:36px;font-weight:800;margin:6px 0 18px}
.panel .row{display:flex;gap:14px;justify-content:center}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:11;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* スマホ（あとに おいて うわがき） */
@media (max-width:520px){
  .side{gap:10px}
  .palette{gap:8px}
  .prog{min-height:70px;padding:8px}
  .slot,.prog .card{width:54px;height:54px;border-radius:13px}
  .palette .card,.palette .repbtn{width:70px;height:70px;border-radius:18px}
  .go{height:68px;padding:0 26px;font-size:26px}
  .round{width:50px;height:50px;font-size:24px}
  .label{font-size:22px}
}
@media (orientation:landscape) and (max-height:560px){
  #game.on{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 16px;padding:8px 16px}
  #game .top{grid-column:1 / 3;max-width:none}
  .slot,.prog .card{width:50px;height:50px}
  .palette .card,.palette .repbtn{width:62px;height:62px}
  .go{height:60px;font-size:24px}
  .round{width:46px;height:46px;font-size:22px}
  .side{gap:10px}
}
</style>
</head>
<body>

<!-- ホーム -->
<section class="screen on" id="home">
  <h1>おさんぽプログラミング<small>カードを ならべて ゴールまで いこう</small></h1>
  <div class="charas" id="charas"></div>
  <div class="worlds" id="worlds"></div>
</section>

<!-- ゲーム -->
<section class="screen" id="game">
  <div class="top">
    <button class="round" id="homeBtn" aria-label="もどる">🏠</button>
    <div class="label" id="label">1-1</div>
    <div class="topr">
      <button class="round" id="hintBtn" aria-label="ヒント">💡</button>
      <button class="round" id="soundBtn" aria-label="おと">🔊</button>
    </div>
  </div>
  <div class="board" id="board"></div>
  <div class="side">
  <div class="prog" id="prog"></div>
  <div class="palette" id="palette"></div>
  <div class="controls">
    <button class="round" id="undoBtn" aria-label="1まい けす"><svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
      <g transform="rotate(-35 20 20)">
        <rect x="5" y="12" width="30" height="16" rx="3" fill="#ff8fab" stroke="#4a3b2a" stroke-width="2"/>
        <path d="M22 12h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H22z" fill="#5aa9ff" stroke="#4a3b2a" stroke-width="2"/>
      </g>
      <path d="M6 36h28" stroke="#4a3b2a" stroke-width="2" stroke-linecap="round" opacity=".35"/>
    </svg></button>
    <button class="go" id="goBtn">▶ スタート</button>
    <button class="round" id="clearBtn" aria-label="ぜんぶ けす">🗑️</button>
  </div>
  </div>
</section>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="big" id="clearChara">🤖</div>
    <div class="msg">やったね！</div>
    <div class="row">
      <button class="round" id="ovHome">🏠</button>
      <button class="go" id="ovNext">つぎへ ▶</button>
    </div>
  </div>
</div>

<script>
/* ========== ステージ ==========
   S=スタート G=ゴール A=りんご #=き .=みち
   slots=ならべられる カードの まいすう */
const WORLDS = [
  { name:'はじめのいっぽ', icon:'👣', cards:['R'], stages:[
    { map:['S.G'],   slots:2 },
    { map:['S..G'],  slots:3 },
    { map:['S...G'], slots:4 },
  ]},
  { name:'まがりみち', icon:'↪️', cards:['L','U','D','R'], stages:[
    { map:['S..','##.','##G'], slots:5 },
    { map:['##G','##.','S..'], slots:5 },
    { map:['G#S','.#.','...'], slots:7 },
  ]},
  { name:'りんご ひろい', icon:'🍎', cards:['L','U','D','R'], stages:[
    { map:['A..','S.G'],             slots:5 },
    { map:['S.#','#.A','#G#'],       slots:6 },
    { map:['A.S','#.#','G..'],       slots:7 },
  ]},
  { name:'くりかえし', icon:'🔁', cards:['L','U','D','R'], rep:true, stages:[
    { map:['S.....G'],                      slots:2 },
    { map:['S...','###.','###.','###G'],    slots:2 },
    { map:['S..A','###.','G...'],           slots:3 },
  ]},
];

const DIRS  = { R:[1,0], L:[-1,0], U:[0,-1], D:[0,1] };
const ROT   = { R:0, D:90, L:180, U:-90 };
const CHARAS = ['🤖','🐱','🐧','🦖','🐶'];
const KEY = 'osanpo-programming-v1';
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5h10V4.5l8 7.5-8 7.5v-5H3z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';

let save = { cleared:{}, chara:'🤖', sound:true };
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} }

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ========== おと ========== */
let ac;
function tone(f, d=.12, type='sine', vol=.18, when=0){
  if (!save.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
  } catch(e){}
}
const sfx = {
  pi:   () => tone(1200, .08, 'square', .08),
  step: (i) => tone(500 + (i % 5) * 70, .1, 'triangle', .2),
  bump: () => { tone(160, .25, 'sawtooth', .12); tone(120, .3, 'sawtooth', .1, .12); },
  apple:() => { tone(880, .1); tone(1320, .15, 'sine', .18, .08); },
  win:  () => [523,659,784,1047].forEach((f,i) => tone(f, .25, 'triangle', .2, i * .12)),
  no:   () => tone(220, .15, 'square', .06),
};
function speak(text){
  if (!save.sound) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = .95; u.pitch = 1.4;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ========== ホーム ========== */
function renderHome(){
  $('#charas').innerHTML = '';
  CHARAS.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c; if (c === save.chara) b.classList.add('sel');
    b.onclick = () => { save.chara = c; persist(); sfx.pi(); renderHome(); };
    $('#charas').appendChild(b);
  });
  $('#worlds').innerHTML = '';
  WORLDS.forEach((w, wi) => {
    const box = document.createElement('div'); box.className = 'world';
    box.innerHTML = `<div class="wname"><span class="ico">${w.icon}</span>${wi+1}. ${w.name}</div><div class="stages"></div>`;
    w.stages.forEach((_, si) => {
      const b = document.createElement('button');
      b.textContent = si + 1;
      if (save.cleared[`${wi}-${si}`]) b.classList.add('done');
      b.onclick = () => { sfx.pi(); openStage(wi, si); };
      box.querySelector('.stages').appendChild(b);
    });
    $('#worlds').appendChild(box);
  });
}
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

/* ========== ゲーム ========== */
let W, S, stage, grid, start, goal, apples, prog = [], running = false, pos, taken, cell, charaEl;
let sel = -1, bad = -1;   // えらんでいる カード / まちがえた カード
let extra = [], justAdded = -1;   // ゴールの あとの あまった カード / いま ふえた カード
function edited(){ bad = -1; extra = []; $('#undoBtn').classList.remove('pulse'); }

function openStage(wi, si){
  W = wi; S = si; stage = WORLDS[wi].stages[si];
  grid = stage.map.map(r => r.split('')); apples = [];
  grid.forEach((row, y) => row.forEach((c, x) => {
    if (c === 'S') start = {x, y};
    if (c === 'G') goal = {x, y};
    if (c === 'A') apples.push({x, y});
  }));
  prog = []; sel = -1; bad = -1; extra = []; trail = [];
  $('#undoBtn').classList.remove('pulse');
  $('#label').textContent = `${wi+1}-${si+1}`;
  show('game');
  buildBoard(); renderProg(); renderPalette(); resetChara(true);
}

function buildBoard(){
  const rows = grid.length, cols = grid[0].length;
  // よこむきの スマホは ばんめんを ひだり、カードを みぎに ならべる
  const side = innerWidth > innerHeight && innerHeight < 560;
  const maxW = side ? innerWidth * 0.48 : Math.min(innerWidth - 32, 900);
  const maxH = side ? innerHeight - 90 : Math.max(150, innerHeight - (innerWidth < 520 ? 440 : 420));
  cell = Math.max(40, Math.floor(Math.min(maxW / cols, maxH / rows, 120)));
  const board = $('#board');
  board.style.width = cols * cell + 'px'; board.style.height = rows * cell + 'px';
  board.style.setProperty('--cell', cell + 'px');
  board.innerHTML = '';
  grid.forEach((row, y) => row.forEach((c, x) => {
    const d = document.createElement('div');
    d.className = 'cell ' + (c === '#' ? 'wall' : 'path') + (c === 'S' ? ' start' : '');
    d.style.left = x * cell + 'px'; d.style.top = y * cell + 'px';
    d.textContent = { '#':'🌳', G:'🏁', A:'🍎' }[c] || '';
    if (c === 'A') d.id = `a${x}-${y}`;
    board.appendChild(d);
  }));
  charaEl = document.createElement('div'); charaEl.className = 'chara';
  charaEl.innerHTML = '<span></span>'; charaEl.firstChild.textContent = save.chara;
  board.appendChild(charaEl);
}

function place(instant){
  if (instant) charaEl.style.transition = 'none';
  charaEl.style.transform = `translate(${pos.x * cell}px, ${pos.y * cell}px)`;
  if (instant) { charaEl.offsetHeight; charaEl.style.transition = ''; }
}
function face(d){ if (d === 'L') charaEl.firstChild.style.transform = 'scaleX(-1)'; if (d === 'R') charaEl.firstChild.style.transform = ''; }
function resetChara(instant){
  pos = { ...start }; taken = new Set(); face('R');
  apples.forEach(a => { const el = $(`#a${a.x}-${a.y}`); if (el) el.classList.remove('got'); });
  charaEl.querySelectorAll('.bubble').forEach(b => b.remove());
  charaEl.classList.remove('hop');
  place(instant);
}
function bubble(text){
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  charaEl.appendChild(b);
}

function cardEl(d, tag='div'){
  const el = document.createElement(tag);
  el.className = 'card'; el.style.background = `var(--${d})`;
  el.innerHTML = ARROW; el.firstChild.style.transform = `rotate(${ROT[d]}deg)`;
  return el;
}

function renderProg(){
  const box = $('#prog'); box.innerHTML = '';
  for (let i = 0; i < stage.slots; i++){
    const c = prog[i];
    if (c){
      const el = cardEl(c.d, 'button');
      el.insertAdjacentHTML('beforeend', `<span class="no">${i+1}</span>`);
      if (c.n > 1) el.insertAdjacentHTML('beforeend', `<span class="rep">×${c.n}</span>`);
      if (i === sel) el.classList.add('sel');
      if (i === bad) el.classList.add('bad');
      if (extra.includes(i)) el.classList.add('extra');
      if (i === justAdded) el.classList.add('pop');
      // タップで「えらぶ」→ 下のカードを押すと いれかわる
      el.onclick = () => { sel = (sel === i) ? -1 : i; edited(); sfx.pi(); renderProg(); };
      box.appendChild(el);
    } else {
      const s = document.createElement('div'); s.className = 'slot';
      s.innerHTML = `<span class="num">${i+1}</span>`;
      s.onclick = () => { if (sel >= 0){ sel = -1; renderProg(); } };
      box.appendChild(s);
    }
  }
  justAdded = -1;
}

function renderPalette(){
  const w = WORLDS[W], box = $('#palette'); box.innerHTML = '';
  w.cards.forEach(d => {
    const b = cardEl(d, 'button');
    b.onclick = () => {
      edited();
      if (sel >= 0){ prog[sel] = { d, n:prog[sel].n }; justAdded = sel; sel = -1; sfx.pi(); renderProg(); return; }
      if (prog.length >= stage.slots){ sfx.no(); speak('もう いっぱいだよ'); flash($('#prog'), 'full'); return; }
      prog.push({ d, n:1 }); justAdded = prog.length - 1; sfx.pi(); renderProg();
    };
    box.appendChild(b);
  });
  if (w.rep){
    box.insertAdjacentHTML('beforeend', '<span class="sep"></span>');
    [2, 3].forEach(n => {
      const b = document.createElement('button'); b.className = 'repbtn'; b.textContent = `×${n}`;
      b.onclick = () => {
        const last = sel >= 0 ? prog[sel] : prog[prog.length - 1];
        if (!last){ sfx.no(); return; }
        last.n = last.n === n ? 1 : n; justAdded = prog.indexOf(last); sel = -1; edited(); sfx.pi(); renderProg();
      };
      box.appendChild(b);
    });
  }
}
function flash(el, cls){ el.classList.remove(cls); el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 500); }

function markCard(i, cls){
  $('#prog').querySelectorAll('.card').forEach((el, j) => el.classList.toggle(cls, j === i));
}

/* とおった ところに カードと おなじ いろの やじるしを のこす */
let trail = [];   // ほんばんで とおった みち（がめんの むきが かわっても かきなおせるように）
function makeFoot(p, d, keep){
  if (keep) trail.push({ p:{ ...p }, d });
  const f = document.createElement('div'); f.className = 'foot';
  f.style.left = p.x * cell + 'px'; f.style.top = p.y * cell + 'px';
  f.style.color = `var(--${d})`;
  f.innerHTML = ARROW; f.firstChild.style.transform = `rotate(${ROT[d]}deg)`;
  $('#board').appendChild(f);
  return f;
}
function clearFeet(){ trail = []; $('#board').querySelectorAll('.foot').forEach(f => f.remove()); }
/* ×3 カードは ●○○ → ●●○ → ●●● と すすむ */
function repProgress(i, k, n){
  if (n < 2) return;
  const el = $('#prog').querySelectorAll('.card')[i];
  const r = el && el.querySelector('.rep');
  if (r) r.textContent = '●'.repeat(k) + '○'.repeat(n - k);
}
function showBubble(text){
  bubble(text);
  setTimeout(() => charaEl.querySelectorAll('.bubble').forEach(b => b.remove()), 2500);
}

async function run(){
  if (running) return;
  if (!prog.length){ sfx.no(); speak('カードを ならべてね'); flash($('#prog'), 'full'); return; }
  running = true; document.body.classList.add('running');
  sel = -1; edited(); renderProg(); clearFeet(); resetChara(true);
  await sleep(300);
  let steps = 0, goalAt = null;
  const allApples = () => taken.size === apples.length;
  try {
    for (let i = 0; i < prog.length; i++){
      const c = prog[i]; markCard(i, 'now');
      for (let t = 0; t < c.n; t++){
        repProgress(i, t + 1, c.n);
        const [dx, dy] = DIRS[c.d], nx = pos.x + dx, ny = pos.y + dy;
        face(c.d);
        const blocked = ny < 0 || ny >= grid.length || nx < 0 || nx >= grid[0].length || grid[ny][nx] === '#';
        if (blocked){
          if (goalAt) return await overshoot(goalAt);
          return await fail(i, '💦', 'あれ？ ぶつかっちゃった。ひかってる カードを かえてみよう');
        }
        makeFoot(pos, c.d, true);
        pos = { x:nx, y:ny }; place(); sfx.step(steps++);
        await sleep(600);
        if (grid[ny][nx] === 'A' && !taken.has(`${nx}-${ny}`)){
          taken.add(`${nx}-${ny}`); $(`#a${nx}-${ny}`).classList.add('got'); sfx.apple();
          await sleep(150);
        }
        if (!goalAt && nx === goal.x && ny === goal.y && allApples()) goalAt = { i, t, n:c.n };
      }
    }
    markCard(-1, 'now');
    const atGoal = pos.x === goal.x && pos.y === goal.y;
    if (atGoal && allApples()) return win();
    if (goalAt) return await overshoot(goalAt);
    if (atGoal) await fail(-1, '🍎？', 'りんごが まだ あるよ');
    else        await fail(-1, '❓', 'あれ？ ゴールに つかなかったね');
  } finally {
    running = false; document.body.classList.remove('running');
  }
}

/* うまく いかなかった とき：キャラは とまった ばしょに のこして、あしあとで ふりかえれる。
   つぎに ▶ を おすと スタートから やりなおす */
async function fail(i, mark, words){
  sfx.bump(); speak(words); showBubble(mark);
  charaEl.classList.add('shake');
  if (i >= 0){ sel = i; bad = i; }   // ぶつかった カードを えらんだ じょうたいに
  markCard(-1, 'now'); renderProg();
  await sleep(700);
  charaEl.classList.remove('shake');
}

/* ゴールを とおりすぎた とき（じつぶつの ロボットと おなじく、カードは さいごまで うごく） */
async function overshoot(g){
  tone(330, .2, 'triangle', .15); tone(262, .25, 'triangle', .12, .15);
  speak('あれ？ ゴールを とおりすぎちゃった'); showBubble('💨');
  if (g.t < g.n - 1){ sel = g.i; bad = g.i; }   // ×の かずが おおかった
  else {
    for (let k = g.i + 1; k < prog.length; k++) extra.push(k);
    $('#undoBtn').classList.add('pulse');
  }
  markCard(-1, 'now'); renderProg();
  await sleep(700);
}

function win(){
  save.cleared[`${W}-${S}`] = true; persist();
  charaEl.classList.add('hop'); sfx.win(); speak('やったね！');
  confetti();
  setTimeout(() => { $('#clearChara').textContent = save.chara; $('#overlay').classList.add('on'); }, 900);
}
function nextStage(){
  $('#overlay').classList.remove('on');
  if (S + 1 < WORLDS[W].stages.length) openStage(W, S + 1);
  else if (W + 1 < WORLDS.length) openStage(W + 1, 0);
  else { renderHome(); show('home'); speak('ぜんぶ クリア！ すごいね'); }
}
function confetti(){
  const colors = ['#ff8a3d','#3d8bff','#2bb673','#a05cf0','#f2b200','#ff5a7a'];
  for (let i = 0; i < 50; i++){
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.4 + 's';
    c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
  }
}

/* ========== ヒント ==========
   こたえの みちを うすい キャラが ゆっくり あるいて、
   とおった ところに カードと おなじ いろの やじるしを のこす */
function solve(){
  const H = grid.length, WD = grid[0].length, full = (1 << apples.length) - 1;
  const idx = new Map(apples.map((a, i) => [`${a.x}-${a.y}`, i]));
  const k0 = `${start.x},${start.y},0`, prev = new Map([[k0, null]]), q = [[start.x, start.y, 0]];
  while (q.length){
    const [x, y, m] = q.shift();
    if (x === goal.x && y === goal.y && m === full){
      const dirs = []; let k = `${x},${y},${m}`;
      while (prev.get(k)){ const [pk, d] = prev.get(k); dirs.unshift(d); k = pk; }
      return dirs;
    }
    for (const d of ['R','D','L','U']){
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (ny < 0 || ny >= H || nx < 0 || nx >= WD || grid[ny][nx] === '#') continue;
      const i = idx.get(`${nx}-${ny}`), nm = i === undefined ? m : m | (1 << i);
      const nk = `${nx},${ny},${nm}`;
      if (!prev.has(nk)){ prev.set(nk, [`${x},${y},${m}`, d]); q.push([nx, ny, nm]); }
    }
  }
  return null;
}

async function hint(){
  if (running) return;
  const dirs = solve(); if (!dirs) return;
  running = true; document.body.classList.add('running');
  sel = -1; bad = -1; renderProg(); resetChara(true);
  const board = $('#board');
  clearFeet();
  const g = document.createElement('div'); g.className = 'chara ghost';
  g.innerHTML = '<span></span>'; g.firstChild.textContent = save.chara;
  board.appendChild(g);
  let p = { ...start };
  const put = (instant) => {
    if (instant) g.style.transition = 'none';
    g.style.transform = `translate(${p.x * cell}px, ${p.y * cell}px)`;
    if (instant){ g.offsetHeight; g.style.transition = ''; }
  };
  put(true);
  charaEl.style.opacity = '.25';   // スタートの やじるしが みえるように
  speak('いっしょに みてみよう');
  await sleep(900);
  for (let i = 0; i < dirs.length; i++){
    const d = dirs[i];
    makeFoot(p, d).classList.add('hintfoot');
    if (d === 'L') g.firstChild.style.transform = 'scaleX(-1)';
    if (d === 'R') g.firstChild.style.transform = '';
    p = { x:p.x + DIRS[d][0], y:p.y + DIRS[d][1] }; put();
    tone(700 + i * 40, .12, 'sine', .12);
    await sleep(950);
  }
  await sleep(500);
  g.remove(); charaEl.style.opacity = '';
  running = false; document.body.classList.remove('running');
  // やじるしは しばらく のこして から きえる
  setTimeout(() => board.querySelectorAll('.hintfoot').forEach(f => {
    f.classList.add('out'); setTimeout(() => f.remove(), 800);
  }), 4000);
}

/* ========== ボタン ========== */
$('#hintBtn').onclick = hint;
$('#goBtn').onclick = run;
// ⬅️ = えらんでいる カードを けす（えらんでいなければ さいごの 1まい）
$('#undoBtn').onclick = () => {
  // あまった カードが あるときは、1まい けすごとに のこりを はいいろの まま にする
  const rest = extra.length ? extra.slice(0, -1) : [];
  if (sel >= 0) prog.splice(sel, 1); else prog.pop();
  sel = -1; edited(); extra = rest;
  if (rest.length) $('#undoBtn').classList.add('pulse');
  sfx.pi(); renderProg();
};
$('#clearBtn').onclick = () => { prog = []; sel = -1; edited(); sfx.pi(); renderProg(); };
$('#homeBtn').onclick = () => { if (running) return; renderHome(); show('home'); };
$('#ovHome').onclick = () => { $('#overlay').classList.remove('on'); renderHome(); show('home'); };
$('#ovNext').onclick = () => { sfx.pi(); nextStage(); };
function soundIcon(){ $('#soundBtn').textContent = save.sound ? '🔊' : '🔇'; }
$('#soundBtn').onclick = () => { save.sound = !save.sound; persist(); soundIcon(); sfx.pi(); };
window.addEventListener('resize', () => {
  if (!$('#game').classList.contains('on') || running) return;
  // ばんめんを つくりなおしても、キャラの いち・あしあと・とった りんごは そのまま
  const keepPos = pos, keepTaken = taken, keepTrail = trail;
  buildBoard(); resetChara(true);
  pos = keepPos; taken = keepTaken; place(true);
  taken.forEach(k => { const el = $(`#a${k}`); if (el) el.classList.add('got'); });
  trail = []; keepTrail.forEach(t => makeFoot(t.p, t.d, true));
});

soundIcon(); renderHome();
</script>
